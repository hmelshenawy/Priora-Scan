[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prioracan"
version = "0.1.0"
description = "Read-only USB-CAN adapter foundation for PrioraScan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-can"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/prioracan"]
omit = ["src/prioracan/drivers/adapters/python_can_adapter.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
